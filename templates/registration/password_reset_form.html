{% extends 'base.html' %}
{% block content %}
  <div class="auth-page">
    <div class="auth-left" style="background-image:url('{% static "images/hero.svg" %}')">
      <div class="auth-left-overlay"></div>
      <div class="auth-left-content">
        <h1>Mot de passe oublié</h1>
        <p>Entrez votre email et nous vous enverrons les instructions.</p>
      </div>
    </div>
    <div class="auth-right">
      <div class="auth-card">
        <h2>Réinitialiser le mot de passe</h2>
        <form method="post">{% csrf_token %}
          <label for="id_email">Email</label>
          <input id="id_email" type="email" name="email" required class="input-field">
          <div style="margin-top:12px"><button class="btn btn-primary" type="submit">Envoyer</button></div>
        </form>
      </div>
    </div>
  </div>
{% endblock %}
