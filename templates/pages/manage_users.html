{% extends 'base.html' %}
{% block content %}
<div class="container" style="padding:24px 16px;">
  <h1>Gestion des rôles</h1>
  <form method="post">{% csrf_token %}
    <table style="width:100%;border-collapse:collapse">
      <thead><tr><th>Utilisateur</th>{% for g in groups %}<th>{{ g.name }}</th>{% endfor %}</tr></thead>
      <tbody>
      {% for u in users %}
        <tr>
          <td style="padding:8px 6px;">{{ u.username }} ({{ u.get_full_name }})</td>
          {% for g in groups %}
            <td style="text-align:center;padding:6px">
              <input class="role-checkbox" type="checkbox" data-username="{{ u.username }}" name="user_{{ u.pk }}" value="{{ g.name }}" {% if g in u.groups.all %}checked{% endif %}>
            </td>
          {% endfor %}
        </tr>
      {% endfor %}
      </tbody>
    </table>
    <div style="margin-top:12px"><button class="btn btn-primary" type="submit">Enregistrer</button></div>
  </form>
  <script src="{% static 'js/manage_users.js' %}"></script>
</div>
{% endblock %}
